<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>M3 élő térkép</title>
<meta name="description" content="Metro Line – M3 Automatic metro simulator: a játékban közlekedő metrók élőben, a valódi M3 vonalán.">
<meta property="og:title" content="M3 élő térkép – Metro Line">
<meta property="og:description" content="Nézd élőben, hol járnak a metrók a játékban.">
<meta name="theme-color" content="#0b1220">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0b1220; --panel:#111a2c; --panel2:#17233a; --line:#25324d; --fg:#e8eef8; --mut:#93a1b8;
  --m3:#005ca5; --m3l:#2f8be0; --kk:#ef5a3c; --up:#1fb36b; --live:#2ee68a; --warn:#f5c542; --off:#8b95a7;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
#app{display:flex;height:100%;width:100%}
#map{flex:1;height:100%;background:#0e1626}
aside{width:360px;max-width:100%;display:flex;flex-direction:column;background:var(--panel);border-left:1px solid var(--line);z-index:500}
header{padding:16px 16px 12px;border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:10px}
.badge{width:34px;height:34px;border-radius:9px;background:var(--m3);display:grid;place-items:center;font-weight:800;font-size:15px;letter-spacing:.5px;box-shadow:0 0 0 3px #ffffff14}
h1{font-size:17px;margin:0;font-weight:800;letter-spacing:.2px}
.sub{color:var(--mut);font-size:12px;margin-top:2px}
.status{display:flex;align-items:center;gap:8px;margin-top:12px;font-size:13px;font-weight:600}
.dot{width:10px;height:10px;border-radius:50%;background:var(--warn);box-shadow:0 0 0 0 currentColor}
.dot.live{background:var(--live);animation:pulse 1.6s infinite}
.dot.off{background:var(--off)}
@keyframes pulse{0%{box-shadow:0 0 0 0 #2ee68a88}70%{box-shadow:0 0 0 9px #2ee68a00}100%{box-shadow:0 0 0 0 #2ee68a00}}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
.stat{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:8px 10px}
.stat b{display:block;font-size:18px;font-variant-numeric:tabular-nums}
.stat span{color:var(--mut);font-size:11px}
#list{flex:1;overflow:auto;padding:10px 10px 4px}
.empty{color:var(--mut);font-size:13px;padding:18px 8px;text-align:center;line-height:1.5}
.tr{display:grid;grid-template-columns:6px 1fr auto;gap:10px;align-items:center;padding:10px;border-radius:12px;background:var(--panel2);border:1px solid var(--line);margin-bottom:8px;cursor:pointer;transition:border-color .15s,transform .15s}
.tr:hover{border-color:#3a4c72}
.tr.sel{border-color:var(--m3l);box-shadow:0 0 0 1px var(--m3l) inset}
.bar{width:6px;align-self:stretch;border-radius:4px}
.nm{font-weight:700;font-size:14px}
.ds{color:var(--mut);font-size:12px;margin-top:3px;line-height:1.35}
.sp{text-align:right;font-variant-numeric:tabular-nums}
.sp b{font-size:18px}
.sp span{display:block;color:var(--mut);font-size:11px}
footer{padding:10px 14px 12px;border-top:1px solid var(--line);font-size:11px;color:var(--mut);display:flex;gap:8px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;gap:6px;background:var(--m3);color:#fff;text-decoration:none;font-weight:700;font-size:12px;padding:8px 11px;border-radius:9px;border:0;cursor:pointer}
.btn.ghost{background:transparent;border:1px solid var(--line);color:var(--fg)}
.legend{position:absolute;left:12px;bottom:22px;z-index:600;background:#111a2ce6;border:1px solid var(--line);border-radius:10px;padding:8px 10px;font-size:12px;backdrop-filter:blur(6px)}
.legend div{display:flex;align-items:center;gap:7px;margin:2px 0}
.sw{width:18px;height:6px;border-radius:3px}
.follow{position:absolute;right:12px;top:12px;z-index:600}
/* állomásfeliratok */
.leaflet-tooltip.stl{background:#ffffffee;color:#1b2333;border:0;box-shadow:0 1px 4px #0004;font:600 11px Inter,sans-serif;padding:2px 6px;border-radius:6px}
.leaflet-tooltip.stl::before{display:none}
.hide-st .leaflet-tooltip.stl{display:none}
.dark .leaflet-tooltip.stl{background:#1a2438ee;color:#e8eef8}
.dark .leaflet-tile-pane{filter:invert(1) hue-rotate(180deg) brightness(.92) contrast(.92)}
/* szerelvény-felirat */
.tlab{width:max-content;white-space:nowrap;transform:translate(-50%,-135%);font:700 12px Inter,sans-serif;padding:3px 7px;border-radius:7px;color:#fff;box-shadow:0 2px 8px #0006;pointer-events:auto;cursor:pointer}
.tlab small{font-weight:600;opacity:.9;margin-left:4px}
.leaflet-container{font-family:Inter,sans-serif}
/* fülek és állomáslista */
.tabs{display:flex;gap:6px;margin-top:12px}
.tab{flex:1;background:var(--panel2);border:1px solid var(--line);color:var(--mut);font:700 12px Inter,sans-serif;padding:8px;border-radius:9px;cursor:pointer}
.tab.on{color:#fff;border-color:var(--m3l);background:#1b3256}
#slist{flex:1;overflow:auto;padding:10px 10px 4px;display:none}
.opt{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--mut);padding:2px 4px 10px}
.st{display:grid;grid-template-columns:22px 1fr;gap:10px;padding:10px;border-radius:12px;background:var(--panel2);border:1px solid var(--line);margin-bottom:8px;cursor:pointer}
.st:hover{border-color:#3a4c72}
.st .nr{width:22px;height:22px;border-radius:50%;border:3px solid var(--m3l);background:#fff;color:#0b2f55;font:800 10px Inter,sans-serif;display:grid;place-items:center}
.st .nm small{color:var(--mut);font-weight:600;margin-left:6px}
.old{display:inline-block;margin:4px 4px 0 0;padding:2px 7px;border-radius:6px;background:#2a2016;color:#f3c58a;font-size:11px;font-weight:600}
.plan{display:inline-block;margin:4px 4px 0 0;padding:2px 7px;border-radius:6px;background:#1d2438;color:#9fb3d8;font-size:11px;font-weight:600;font-style:italic}
.here{display:inline-block;margin:4px 4px 0 0;padding:2px 7px;border-radius:6px;font-size:11px;font-weight:700;color:#fff}
.sec{color:var(--mut);font:700 11px Inter,sans-serif;text-transform:uppercase;letter-spacing:.6px;margin:12px 4px 6px}
.leaflet-popup-content{font:13px/1.45 Inter,sans-serif;margin:12px 14px}
.leaflet-popup-content h3{margin:0 0 4px;font-size:15px}
.leaflet-popup-content .mut{color:#5b6678;font-size:12px}
@media (max-width:780px){
  #app{flex-direction:column}
  aside{width:100%;height:44%;border-left:0;border-top:1px solid var(--line)}
  #map{height:56%}
  .legend{bottom:12px}
}
</style>
</head>

      <div class="tabs"><button class="tab on" id="tabTr">🚇 Metrók</button><button class="tab" id="tabSt">📍 Állomások (20)</button></div>

    <div id="slist"></div>

    <footer>

</div>

let showOld = false;
try { showOld = localStorage.getItem("m3old") === "1"; } catch (e) {}
const origName = (n) => { const i = STINFO[n]; return i && i.old ? i.old[0][0] : n; };

// ===== JÁTÉK → VALÓDI TÉRKÉP =====
// szakaszonként (két szomszédos állomás között) hasonlósági leképezés: a két állomás pontosan a valódi helyére kerül,
// a köztes ívek alakja a játékból jön
const LAT0 = 47.51, LON0 = 19.08, KX = 111320 * Math.cos(LAT0 * Math.PI / 180), KY = 110574;
const toM = (lat, lon) => [(lon - LON0) * KX, (lat - LAT0) * KY];
const toLL = (p) => [LAT0 + p[1] / KY, LON0 + p[0] / KX];
const cmul = (a, b) => [a[0] * b[0] - a[1] * b[1], a[0] * b[1] + a[1] * b[0]];
const cdiv = (a, b) => { const d = b[0] * b[0] + b[1] * b[1]; return [(a[0] * b[0] + a[1] * b[1]) / d, (a[1] * b[0] - a[0] * b[1]) / d]; };
const ST = ST_GAME.map(([s, x, z, name]) => ({ s, g: [x, -z], name, m: toM(...REAL[name]) }));
const SEG = [];
for (let i = 0; i < ST.length - 1; i++) {
  const A = ST[i].g, B = ST[i + 1].g, A2 = ST[i].m, B2 = ST[i + 1].m;
  const a = cdiv([B2[0] - A2[0], B2[1] - A2[1]], [B[0] - A[0], B[1] - A[1]]);
  const aA = cmul(a, A);
  SEG.push({ s0: ST[i].s, s1: ST[i + 1].s, a, b: [A2[0] - aA[0], A2[1] - aA[1]] });
}
function segFor(s) {
  for (const g of SEG) if (s <= g.s1) return g;
  return SEG[SEG.length - 1];
}
function gameAt(s) {
  let lo = 0, hi = PL.length - 1;
  if (s <= PL[0][0]) { lo = 0; hi = 1; }
  else if (s >= PL[hi][0]) { lo = hi - 1; }
  else { while (hi - lo > 1) { const mid = (lo + hi) >> 1; if (PL[mid][0] <= s) lo = mid; else hi = mid; } }
  const A = PL[lo], B = PL[lo + 1 <= PL.length - 1 ? lo + 1 : lo];
  const t = (B[0] === A[0]) ? 0 : (s - A[0]) / (B[0] - A[0]);
  return [A[1] + (B[1] - A[1]) * t, -(A[2] + (B[2] - A[2]) * t)];
}
function mAt(s) { const T = segFor(s), r = cmul(T.a, gameAt(s)); return [r[0] + T.b[0], r[1] + T.b[1]]; }
// a vágány közepétől oldalra tolva (jobb kéz szabály: menetirány szerint jobbra) méterben
function llAt(s, side) {
  const p = mAt(s);
  if (side) {
    const q = mAt(s + 6), dx = q[0] - p[0], dy = q[1] - p[1], L = Math.hypot(dx, dy) || 1;
    p[0] += side * (dy / L); p[1] += side * (-dx / L);
  }
  return toLL(p);
}

// ===== TÉRKÉP =====
const map = L.map("map", { zoomControl: true, preferCanvas: true, zoomSnap: 0.25 });
// OpenStreetMap-csempék; a sötét mód ugyanezek színszűrővel
L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", { maxZoom: 19, attribution: '© <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>' }).addTo(map);
let dark = false;
try { dark = localStorage.getItem("m3dark") === "1"; } catch (e) {}
function applyTheme() {
  document.body.classList.toggle("dark", dark);
  document.getElementById("theme").textContent = dark ? "☀️" : "🌙";
}
document.getElementById("theme").onclick = () => { dark = !dark; try { localStorage.setItem("m3dark", dark ? "1" : "0"); } catch (e) {} applyTheme(); };
applyTheme();

// a vonal (fehér szegéllyel)
const lineLL = [];
for (let s = ST[0].s - 250; s <= ST[ST.length - 1].s + 250; s += 40) lineLL.push(llAt(s, 0));
L.polyline(lineLL, { color: "#ffffff", weight: 11, opacity: 0.9, interactive: false }).addTo(map);
L.polyline(lineLL, { color: "#005ca5", weight: 6, opacity: 1, interactive: false }).addTo(map);
map.fitBounds(L.latLngBounds(lineLL).pad(0.06));
function stPopup(st) {
  const i = STINFO[st.name] || {};
  let h = "<h3>Ⓜ3 " + escapeHtml(st.name) + "</h3><div class='mut'>Átadva: " + (i.o || "–") + "</div>";
  if (i.old) h += "<div style='margin-top:6px'><b>Korábbi név:</b> " + i.old.map(o => escapeHtml(o[0]) + " (" + o[1] + (o[2] ? ", " + o[2] : "") + ")").join(", ") + "</div>";
  if (i.plan) h += "<div style='margin-top:4px'><b>Tervezett név:</b> " + i.plan.map(escapeHtml).join(", ") + "</div>";
  if (i.tr) h += "<div style='margin-top:4px'><b>Átszállás:</b> " + escapeHtml(i.tr) + "</div>";
  if (i.n) h += "<div class='mut' style='margin-top:4px'>" + escapeHtml(i.n) + "</div>";
  const here = trainsNear(st);
  if (here) h += "<div style='margin-top:6px'>" + here + "</div>";
  return h;
}
for (const st of ST) {
  const end = st === ST[0] || st === ST[ST.length - 1];
  st.mk = L.circleMarker(llAt(st.s, 0), { radius: end ? 7 : 5.5, color: "#005ca5", weight: 3, fillColor: "#fff", fillOpacity: 1 })
    .bindTooltip(showOld ? origName(st.name) : st.name, { permanent: true, direction: "right", offset: [8, 0], className: "stl" })
    .bindPopup(() => stPopup(st), { maxWidth: 280 }).addTo(map);
}
function applyOldNames() { for (const st of ST) st.mk.setTooltipContent(showOld ? origName(st.name) : st.name); }
function stLabels() { document.getElementById("map").classList.toggle("hide-st", map.getZoom() < 13.25); }
map.on("zoomend", stLabels); stLabels();

// ===== SZERELVÉNYEK =====
const trains = new Map();   // név → állapot + rajz
let follow = null;
const shortName = (n) => n.replace(/^81-717 v\.2/, "Panda").replace(/^81-717/, "Ev").replace(/^Ganz-Hunslet G2/, "Ganz");
const colorOf = (t) => (t.dd > 0 ? "#ef5a3c" : "#1fb36b");
function kmh(v) { return Math.round(v * 3.6 / STUD_M); }
// a pillanatnyi hely a vonal mentén: az utolsó adat + a sebességből előre számolva (és a korábbi becslés hibája elsimítva)
function sNow(t, now) {
  let age = Math.min(Math.max((now - t.t0) / 1000 + LEAD, 0), 3);
  let v = t.v, a = t.a || 0;
  if (a < 0 && v > 0) age = Math.min(age, v / -a);
  if (v <= 0 && a <= 0) { v = 0; a = 0; }
  let s = t.s0 + t.md * (v * age + 0.5 * a * age * age);
  const k = Math.max(0, 1 - (now - t.eT) / 700);
  return s + t.err * k;
}
function speedNow(t, now) {
  let age = Math.min(Math.max((now - t.t0) / 1000 + LEAD, 0), 3);
  return Math.max(0, t.v + (t.a || 0) * age);
}
function nextStation(t, s) {
  if (t.k) return null;
  if (t.dd > 0) { for (const st of ST) if (st.s > s + 120) return st; }
  else { for (let i = ST.length - 1; i >= 0; i--) if (ST[i].s < s - 120) return ST[i]; }
  return null;
}
function atStation(s) { for (const st of ST) if (Math.abs(st.s - s) < 190) return st; return null; }
function fmtDist(st) { const m = st / STUD_M; return m >= 1000 ? (m / 1000).toFixed(1).replace(".", ",") + " km" : Math.round(m / 10) * 10 + " m"; }

function ensureDraw(t) {
  if (t.body) return;
  t.body = L.polyline([], { color: colorOf(t), weight: 9, opacity: 1, lineCap: "round" }).addTo(map);
  t.nose = L.circleMarker([0, 0], { radius: 4, color: "#fff", weight: 2, fillColor: colorOf(t), fillOpacity: 1 }).addTo(map);
  t.label = L.marker([0, 0], { icon: L.divIcon({ className: "", html: "", iconSize: [0, 0] }), zIndexOffset: 1000 }).addTo(map);
  const pick = () => selectTrain(t.n);
  t.body.on("click", pick); t.label.on("click", pick);
}
function removeDraw(t) { for (const k of ["body", "nose", "label"]) if (t[k]) { map.removeLayer(t[k]); t[k] = null; } }

function onData(d) {
  const now = performance.now();
  lastData = now;
  if (!d || d.off) { setStatus("off"); updateCounts(d); for (const t of trains.values()) removeDraw(t); trains.clear(); renderList(true); return; }
  updateCounts(d);
  const seen = new Set();
  const arr = Array.isArray(d.tr) ? d.tr : (d.tr ? Object.values(d.tr) : []);
  for (const r of arr) {
    if (!r || !r.n) continue;
    seen.add(r.n);
    let t = trains.get(r.n);
    const md = (r.m === 1 || r.m === -1) ? r.m : (r.d || 1);
    if (!t) { t = { n: r.n, err: 0, eT: 0 }; trains.set(r.n, t); }
    else {
      const pred = sNow(t, now), diff = pred - r.s;
      t.err = Math.abs(diff) < 400 ? diff : 0; t.eT = now;
    }
    const prevDir = t.dd;
    Object.assign(t, { s0: r.s, v: r.v || 0, a: r.a || 0, md, dd: r.d || md, t0: now, dr: r.dr, k: r.k, h: r.h, L: r.L || 466 });
    if (prevDir !== undefined && prevDir !== t.dd) removeDraw(t);
    ensureDraw(t);
  }
  for (const [n, t] of trains) if (!seen.has(n)) { removeDraw(t); trains.delete(n); if (follow === n) follow = null; }
  setStatus("live");
  renderList();
}

function frame() {
  const now = performance.now();
  for (const t of trains.values()) {
    if (!t.body) continue;
    const s = sNow(t, now), side = t.dd * 4.5, half = (t.L || 466) / 2;
    const pts = [];
    for (let q = -half; q <= half + 0.1; q += half / 6) pts.push(llAt(s + q, side));
    t.body.setLatLngs(pts);
    const front = llAt(s + t.md * half, side);
    t.nose.setLatLng(front);
    const mid = llAt(s, side);
    t.label.setLatLng(mid);
    const v = speedNow(t, now);
    const txt = shortName(t.n) + "<small>" + (t.k ? "fordul" : (v > 0.3 ? kmh(v) + " km/h" : (t.dr ? "ajtók nyitva" : "áll"))) + "</small>";
    if (t._txt !== txt) { t._txt = txt; t.label.setIcon(L.divIcon({ className: "", iconSize: [0, 0], html: '<div class="tlab" style="background:' + colorOf(t) + '">' + txt + "</div>" })); }
    if (follow === t.n) map.panTo(mid, { animate: false });
  }
  if (lastData && performance.now() - lastData > 12000) setStatus("stale");
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
setInterval(() => renderList(), 500);

// ===== LISTA, ÁLLAPOT =====
let lastData = 0;
function setStatus(k) {
  const dot = document.getElementById("dot"), st = document.getElementById("stat");
  dot.className = "dot" + (k === "live" ? " live" : (k === "off" || k === "stale" ? " off" : ""));
  st.textContent = k === "live" ? "Élő – valós idejű adatok" : k === "off" ? "Most nem fut szerver – lépj be a játékba!" : k === "stale" ? "Nincs friss adat (nem fut szerver?)" : "Kapcsolódás…";
}
function updateCounts(d) {
  const arr = d && d.tr ? (Array.isArray(d.tr) ? d.tr : Object.values(d.tr)) : [];
  document.getElementById("nTr").textContent = d && !d.off ? arr.length : 0;
  document.getElementById("nDep").textContent = d && d.dep != null ? d.dep : "–";
  document.getElementById("nPl").textContent = d && d.p != null ? d.p : 0;
}
function selectTrain(n) {
  follow = (follow === n) ? null : n;
  const t = trains.get(n);
  if (follow && t) map.setView(llAt(sNow(t, performance.now()), 0), Math.max(map.getZoom(), 15.5));
  renderList();
}
map.on("dragstart", () => { if (follow) { follow = null; renderList(); } });
function renderList(force) {
  const el = document.getElementById("list");
  const now = performance.now();
  const arr = [...trains.values()].map(t => ({ t, s: sNow(t, now) })).sort((a, b) => a.s - b.s);
  if (!arr.length) { el.innerHTML = '<div class="empty">' + (document.getElementById("stat").textContent.startsWith("Most nem") ? "Jelenleg nincs futó szerver.<br>Amint valaki belép, itt megjelennek a metrók." : "Várakozás az adatokra…") + "</div>"; return; }
  el.innerHTML = arr.map(({ t, s }) => {
    const v = speedNow(t, now), at = atStation(s), nx = nextStation(t, s);
    let where;
    if (t.k) where = "fordul a végállomás mögött";
    else if (at) where = at.name + (t.dr ? " · ajtók nyitva" : "");
    else if (nx) where = "→ " + nx.name + " · " + fmtDist(Math.abs(nx.s - s));
    else where = "";
    const dirTxt = t.dd > 0 ? "▼ Kőbánya-Kispest felé" : "▲ Újpest-központ felé";
    return '<div class="tr' + (follow === t.n ? " sel" : "") + '" data-n="' + t.n.replace(/"/g, "&quot;") + '">' +
      '<div class="bar" style="background:' + colorOf(t) + '"></div>' +
      '<div><div class="nm">' + shortName(t.n) + (t.h ? " · 🧑‍✈️ " + escapeHtml(t.h) : "") + '</div><div class="ds">' + dirTxt + "<br>" + where + "</div></div>" +
      '<div class="sp"><b>' + (v > 0.3 ? kmh(v) : 0) + "</b><span>km/h</span></div></div>";
  }).join("");
  for (const row of el.querySelectorAll(".tr")) row.onclick = () => selectTrain(row.dataset.n);
}
function escapeHtml(s) { return String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c])); }

// ===== ÁLLOMÁSOK FÜL =====
function trainsNear(st) {
  const now = performance.now(); const out = [];
  for (const t of trains.values()) {
    const s = sNow(t, now), d = st.s - s;
    if (Math.abs(d) < 190) out.push('<span class="here" style="background:' + colorOf(t) + '">' + escapeHtml(shortName(t.n)) + (t.dr ? " · ajtók nyitva" : " · itt") + "</span>");
    else if (!t.k && d * t.dd > 0 && Math.abs(d) < 3000) {
      const v = speedNow(t, now), sec = v > 0.5 ? Math.round(Math.abs(d) / v) : null;
      out.push('<span class="here" style="background:' + colorOf(t) + '">' + escapeHtml(shortName(t.n)) + " · " + (sec != null ? (sec < 60 ? sec + " mp" : Math.round(sec / 60) + " perc") : fmtDist(Math.abs(d))) + "</span>");
    }
  }
  return out.join("");
}
let tab = "tr";
function setTab(k) {
  tab = k;
  document.getElementById("tabTr").classList.toggle("on", k === "tr");
  document.getElementById("tabSt").classList.toggle("on", k === "st");
  document.getElementById("list").style.display = k === "tr" ? "" : "none";
  document.getElementById("slist").style.display = k === "st" ? "block" : "none";
  if (k === "st") renderStations();
}
document.getElementById("tabTr").onclick = () => setTab("tr");
document.getElementById("tabSt").onclick = () => setTab("st");
function renderStations() {
  const el = document.getElementById("slist");
  const scroll = el.scrollTop;
  let h = '<a class="btn" style="margin:0 4px 10px;display:flex;justify-content:center" href="allomasok.html">📷 Állomások képekben – régen és ma</a>';
  h += '<label class="opt"><input type="checkbox" id="oldChk"' + (showOld ? " checked" : "") + "> Régi (eredeti) nevek a térképen</label>";
  h += ST.map((st, i) => {
    const inf = STINFO[st.name] || {};
    let x = '<div class="st" data-i="' + i + '"><div class="nr">' + (i + 1) + '</div><div><div class="nm">' + escapeHtml(st.name) + "<small>" + (inf.o || "") + "</small></div>";
    if (inf.old) x += inf.old.map(o => '<span class="old">korábban: ' + escapeHtml(o[0]) + " · " + o[1] + "</span>").join("");
    if (inf.plan) x += inf.plan.map(p => '<span class="plan">' + escapeHtml(p) + "</span>").join("");
    if (inf.tr) x += '<div class="ds">' + escapeHtml(inf.tr) + "</div>";
    x += trainsNear(st);
    return x + "</div></div>";
  }).join("");
  h += '<div class="sec">A vonal építése</div>' + SEGS.map(s => '<div class="ds" style="padding:0 6px 4px"><b style="color:var(--fg)">' + s[0] + "</b> · " + s[1] + "</div>").join("");
  h += '<div class="ds" style="padding:8px 6px 14px">Az állomások 2017 és 2023 között felújítás miatt szakaszosan zárva voltak.</div>';
  el.innerHTML = h;
  el.scrollTop = scroll;
  document.getElementById("oldChk").onchange = (e) => { showOld = e.target.checked; try { localStorage.setItem("m3old", showOld ? "1" : "0"); } catch (er) {} applyOldNames(); };
  for (const row of el.querySelectorAll(".st")) row.onclick = () => { const st = ST[+row.dataset.i]; map.setView(llAt(st.s, 0), Math.max(map.getZoom(), 15)); st.mk.openPopup(); };
}
setInterval(() => { if (tab === "st") renderStations(); }, 2000);

// ===== ÉLŐ ADAT (Firebase, folyamatos adatfolyam) =====
let es;
function connect() {
  setStatus("connecting");
  try { if (es) es.close(); } catch (e) {}
  es = new EventSource(DB + "/m3.json");
  const handle = (e) => {
    try {
      const m = JSON.parse(e.data);
      if (m && m.path === "/") onData(m.data);
      else if (m && typeof m.path === "string") { // részleges frissítés: újraolvasás
        fetch(DB + "/m3.json").then(r => r.json()).then(onData).catch(() => {});
      }
    } catch (err) {}
  };
  es.addEventListener("put", handle);
  es.addEventListener("patch", handle);
  es.onerror = () => { setStatus("connecting"); };
}
connect();
document.addEventListener("visibilitychange", () => { if (!document.hidden && (!lastData || performance.now() - lastData > 5000)) connect(); });
</script>
</body>
</html>
